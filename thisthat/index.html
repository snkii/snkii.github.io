<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>This & That – Seonuk Kim</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="seon.uk" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- 보안 향상을 위한 메타태그 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    img-src 'self' https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    script-src 'self' https://cdnjs.cloudflare.com;
  "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Permissions-Policy"
      content="geolocation=(), microphone=(), camera=(), fullscreen=()"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-store, max-age=0, must-revalidate"
    />

    <style>
      :root {
        --bg: #282828;
        --fg: #ebdbb2;
        --divider: rgba(235, 219, 178, 0.1);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--fg);
        font-family: "DM Sans", sans-serif;
        height: calc(var(--vh, 1vh) * 100);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
      }

      .title {
        text-align: center;
        font-size: 2.2rem;
        margin-top: 2rem;
        animation: fadeIn 1.2s ease-in-out forwards;
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
      }

      .floating-tags-wrapper {
        position: absolute;
        top: 52%; /* 50%보다 살짝 위 */
        left: 50%;
        transform: translate(-50%, -50%);
        height: 70vh;
        max-width: 1000px;
        width: 100%;
        overflow: visible;
      }

      @supports (-webkit-touch-callout: none) {
        .floating-tags-wrapper {
          top: 52%;
          height: 50vh;
        }
      }

      .floating-tags {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .tag {
        position: absolute;
        background: rgba(235, 219, 178, 0.12);
        border: 1px solid var(--divider);
        border-radius: 9999px;
        padding: 0.6rem 1.2rem;
        font-size: 0.95rem;
        color: var(--fg);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        white-space: nowrap;
        backdrop-filter: blur(2px);
        pointer-events: auto;
        transition: none;
        will-change: transform;
        backface-visibility: hidden;
        transform-style: preserve-3d;
        contain: layout style;
        user-select: none;
        text-decoration: none;
      }

      @keyframes floaty {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      .copyright {
        font-size: 0.5rem;
        color: var(--fg);
        opacity: 0.6;
        pointer-events: none;
        text-align: center;
        position: absolute;
        bottom: 16px;
        width: 100%;
      }

      @media (min-width: 768px) {
        .tag {
          font-size: 1.1rem;
          padding: 0.75rem 1.4rem;
        }
      }

      @media (min-width: 1024px) {
        .tag {
          font-size: 1.25rem;
          padding: 0.9rem 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="title">This & That</h1>

    <div class="floating-tags-wrapper">
      <div class="floating-tags">
        <a
          href="https://en.wikipedia.org/wiki/Jesus"
          class="tag"
          target="_blank"
          rel="noopener"
          >#Jesus</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Bible"
          class="tag"
          target="_blank"
          rel="noopener"
          >#Bible</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Aquascaping"
          class="tag"
          target="_blank"
          rel="noopener"
          >#Aquascaping</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Aquarium"
          class="tag"
          target="_blank"
          rel="noopener"
          >#Aquarium</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Moss"
          class="tag"
          target="_blank"
          rel="noopener"
          >#MossGarden</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Digital_camera"
          class="tag"
          target="_blank"
          rel="noopener"
          >#Camera</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Ricoh_GR_digital_cameras"
          class="tag"
          target="_blank"
          rel="noopener"
          >#GR3x</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Computer_programming"
          class="tag"
          target="_blank"
          rel="noopener"
          >#VibeCoding</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Interior_design"
          class="tag"
          target="_blank"
          rel="noopener"
          >#InteriorDesign</a
        >
        <a
          href="https://en.wikipedia.org/wiki/Mechanical_keyboard"
          class="tag"
          target="_blank"
          rel="noopener"
          >#CustomKeyboard</a
        >
      </div>
    </div>

    <div class="copyright">© 2025 Seonuk Kim. All rights reserved.</div>
    <script src="script.js?v=1.0.0"></script>
  </body>
</html>
