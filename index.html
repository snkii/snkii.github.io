<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seonuk Kim</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #282828;
      --fg: #ebdbb2;
      --accent: #fabd2f;
      --hover: #fe8019;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      height: 100%;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    .center {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 2.5rem;
      transition: color 0.3s ease;
    }

    a:hover {
      color: var(--hover);
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      a {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="center">
    <a href="mailto:hello@seonuk.kim" class="fade-in">hello@seonuk.kim</a>
  </div>
</body>
</html>
