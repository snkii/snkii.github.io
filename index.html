<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Seonuk Kim</title>

    <meta
      name="description"
      content="Seonuk Kim (김선욱)'s personal site. A minimalist space for GR3x photography, web experiments, and thoughts on design."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="Seonuk Kim" />
    <meta
      property="og:description"
      content="Seonuk Kim (김선욱)'s personal site."
    />
    <meta property="og:image" content="https://seon.uk/preview.png" />
    <meta property="og:url" content="https://seon.uk" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="seon.uk" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seonuk Kim" />
    <meta
      name="twitter:description"
      content="Seonuk Kim (김선욱)'s personal site."
    />
    <meta name="twitter:image" content="https://seon.uk/preview.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="seon.uk" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- 보안 향상을 위한 메타태그 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' https:;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
  script-src 'self' https://cdnjs.cloudflare.com;
"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Permissions-Policy"
      content="geolocation=(), microphone=(), camera=(), fullscreen=()"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-store, max-age=0, must-revalidate"
    />

    <style>
      :root {
        --bg: #282828;
        --fg: #ebdbb2;
        --accent: #fabd2f;
        --hover: #fe8019;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--fg);
        height: 100%;
        width: 100%;
        font-family: "DM Sans", sans-serif;
        overflow: hidden;
        transition: background-color 0.6s ease, color 0.6s ease;
      }

      .center {
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .fade-in {
        opacity: 0;
        animation: fadeIn 2s ease-in-out forwards;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-size: 3rem;
        user-select: none;
        -webkit-user-select: none;
        transition: color 0.3s ease;
        cursor: pointer;
      }

      .welcome {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        font-size: 1rem;
        color: inherit;
        pointer-events: none;
      }

      .instruction {
        position: absolute;
        bottom: 50px;
        width: 100%;
        text-align: center;
        font-size: 1rem;
        color: inherit;
        pointer-events: none;
        animation: blink 2s infinite alternate;
      }

      .credit {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        writing-mode: vertical-rl;
        text-orientation: mixed;
        font-size: 0.6rem;
        color: var(--fg);
        letter-spacing: 0.05em;
        pointer-events: none;
      }

      .gallery {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-60%);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: auto;
        font-size: 0.9rem;
        color: var(--fg);
        letter-spacing: 0.05em;
        text-decoration: none;
        cursor: pointer;
      }

      .gallery-text {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        white-space: nowrap;
      }

      .gallery-blink {
        animation: blink 2s infinite alternate;
        margin-bottom: 6px;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes blink {
        0% {
          opacity: 0.2;
        }

        100% {
          opacity: 1;
        }
      }

      @media (max-width: 600px) {
        a {
          font-size: 1.8rem;
        }

        .social-links a {
          font-size: 1.2rem;
        }
      }

      .social-links {
        margin-top: 20px;
        display: flex;
        gap: 20px;
        justify-content: center;
      }

      .social-links a {
        color: var(--accent);
        font-size: 1.5rem;
        transition: color 0.3s ease;
      }

      .social-links a:hover {
        color: var(--hover);
      }

      .copyright {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.4rem;
        color: var(--fg);
        opacity: 0.6;
        pointer-events: none;
        letter-spacing: 0.03em;
      }

      .about {
        position: absolute;
        right: 10px;
        top: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: auto;
        font-size: 0.9rem;
        color: var(--fg);
        letter-spacing: 0.05em;
        text-decoration: none;
        cursor: pointer;
      }

      .about-text {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        white-space: nowrap;
      }

      .about-blink {
        animation: blink 2s infinite alternate;
        margin-bottom: 6px;
      }

      .thisthat {
        position: absolute;
        right: 10px;
        bottom: 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: auto;
        font-size: 0.9rem;
        color: var(--fg);
        letter-spacing: 0.05em;
        text-decoration: none;
        cursor: pointer;
      }

      .thisthat-text {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        white-space: nowrap;
      }

      .thisthat-blink {
        animation: blink 2s infinite alternate;
        margin-bottom: 6px;
      }
    </style>

    <script src="script.js?v=1.2.8" defer></script>
  </head>

  <body>
    <div class="welcome">This is seon.uk</div>

    <div class="center">
      <div class="fade-in" style="text-align: center">
        <a href="mailto:hello@seonuk.kim" id="email-link"> hello@seonuk.kim </a>

        <div class="social-links fade-in">
          <a
            href="https://instagram.com/snkiilog"
            target="_blank"
            aria-label="Instagram"
          >
            <i class="fab fa-instagram"></i>
          </a>
          <a
            href="https://x.com/snkii35"
            target="_blank"
            aria-label="X (Twitter)"
          >
            <i class="fab fa-x-twitter"></i>
          </a>
          <a
            href="https://github.com/snkii"
            target="_blank"
            aria-label="GitHub"
          >
            <i class="fab fa-github"></i>
          </a>
          <a
            href="https://linkedin.com/in/seonuk-kim-026aa1359"
            target="_blank"
            aria-label="LinkedIn"
          >
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a
            href="https://velog.io/@snkii"
            target="_blank"
            aria-label="Velog (dev)"
          >
            <i class="fas fa-laptop-code"></i>
          </a>
        </div>
      </div>
    </div>

    <div class="instruction">Tap or click anywhere</div>
    <div class="credit">Co-designed with ChatGPT</div>

    <a href="gallery" class="gallery">
      <div class="gallery-blink">&gt;</div>
      <div class="gallery-text">My Photobook</div>
    </a>

    <div class="copyright">© 2025 Seonuk Kim. All rights reserved.</div>

    <a href="about" class="about">
      <div class="about-blink">&gt;</div>
      <div class="about-text">About me</div>
    </a>

    <a href="thisthat" class="thisthat">
      <div class="thisthat-blink">&gt;</div>
      <div class="thisthat-text">This & That</div>
    </a>
  </body>
</html>
