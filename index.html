<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seonuk Kim</title>

  <!-- 💬 미리보기 카드용 메타태그 -->
  <meta property="og:title" content="Seonuk Kim">
  <meta property="og:description" content="hello@seonuk.kim — Contact me here.">
  <meta property="og:image" content="https://snkii.github.io/preview.png">
  <meta property="og:url" content="https://snkii.github.io">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 🔤 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=swap" rel="stylesheet">

  <!-- 🎨 스타일 -->
  <style>
    :root {
      --bg: #282828;
      --fg: #ebdbb2;
      --accent: #fabd2f;
      --hover: #fe8019;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      height: 100%;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    .center {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 2.5rem;
      transition: color 0.3s ease;
    }

    a:hover {
      color: var(--hover);
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      a {
        font-size: 1.8rem;
      }
    }
  </style>

  <script>
    const gruvboxColors = [
      "#282828", "#3c3836", "#504945", "#665c54", "#7c6f64", // dark grays
      "#b8bb26", "#fabd2f", "#fe8019", "#fb4934", "#d3869b", // bright colors
      "#8ec07c", "#83a598", "#ebdbb2", "#d5c4a1", "#928374"  // lights & neutrals
    ];

    function getRandomColorPair() {
      let bg, fg;
      do {
        bg = gruvboxColors[Math.floor(Math.random() * gruvboxColors.length)];
        fg = gruvboxColors[Math.floor(Math.random() * gruvboxColors.length)];
      } while (bg === fg);
      return { bg, fg };
    }

    function applyColors(bg, fg) {
      document.body.style.backgroundColor = bg;
      document.body.style.color = fg;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.body.addEventListener("click", () => {
        const { bg, fg } = getRandomColorPair();
        applyColors(bg, fg);
      });
    });
  </script>
</head>
<body>
  <div class="center">
    <a href="mailto:hello@seonuk.kim" class="fade-in">hello@seonuk.kim</a>
  </div>
</body>
</html>
