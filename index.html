  <style>
    :root {
      --bg: #282828;
      --fg: #ebdbb2;
      --accent: #fabd2f;
      --hover: #fe8019;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      height: 100%;
      width: 100%;
      font-family: "DM Sans", sans-serif;
      overflow: hidden;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    .center {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
    }

    a {
      text-decoration: none;
      font-size: 3rem;
      user-select: none;
      -webkit-user-select: none;
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .welcome {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      color: inherit;
      pointer-events: none;
    }

    .instruction {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      color: inherit;
      pointer-events: none;
      animation: blink 2s infinite alternate;
    }

    .credit {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 0.6rem;
      color: var(--fg);
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    .vision {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      font-size: 0.9rem;
      color: var(--fg);
      letter-spacing: 0.05em;
      text-decoration: none;
      cursor: pointer;
    }

    .vision-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      white-space: nowrap;
    }

    .vision-blink {
      animation: blink 2s infinite alternate;
      margin-bottom: 6px;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0% {
        opacity: 0.2;
      }

      100% {
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      a {
        font-size: 1.8rem;
      }

      .social-links a {
        font-size: 1.2rem;
      }
    }

    .social-links {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .social-links a {
      color: var(--accent);
      font-size: 1.5rem;
      transition: color 0.3s ease;
    }

    .social-links a:hover {
      color: var(--hover);
    }

    .copyright {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.4rem;
      color: var(--fg);
      opacity: 0.6;
      pointer-events: none;
      letter-spacing: 0.03em;
    }
  </style>

  <script>
    const gruvboxColors = [
      "#282828",
      "#3c3836",
      "#504945",
      "#665c54",
      "#7c6f64",
      "#b8bb26",
      "#fabd2f",
      "#fe8019",
      "#fb4934",
      "#d3869b",
      "#8ec07c",
      "#ebdbb2",
      "#d5c4a1",
      "#928374",
      "#83a598",
      "#458588",
    ];

    function luminance(hex) {
      const rgb = hex
        .replace("#", "")
        .match(/.{2}/g)
        .map((c) => parseInt(c, 16) / 255);
      const linear = rgb.map((c) =>
        c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
      );
      return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
    }

    function contrastRatio(c1, c2) {
      const L1 = luminance(c1);
      const L2 = luminance(c2);
      return (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05);
    }

    function getReadableColors() {
      let bg, text, link;
      const MAX_TRIES = 100;
      for (let i = 0; i < MAX_TRIES; i++) {
        bg = gruvboxColors[Math.floor(Math.random() * gruvboxColors.length)];
        text =
          gruvboxColors[Math.floor(Math.random() * gruvboxColors.length)];
        link =
          gruvboxColors[Math.floor(Math.random() * gruvboxColors.length)];

        const contrastText = contrastRatio(bg, text);
        const contrastLink = contrastRatio(bg, link);
        const distinct = new Set([bg, text, link]).size === 3;

        if (distinct && contrastText >= 4.5 && contrastLink >= 4.5) {
          return { bg, text, link };
        }
      }
      return { bg: "#282828", text: "#ebdbb2", link: "#fabd2f" };
    }

    function applyColors(bg, text, link) {
      document.body.style.backgroundColor = bg;
      document.body.style.color = text;

      const a = document.querySelector("a");
      const welcome = document.querySelector(".welcome");
      const instruction = document.querySelector(".instruction");
      const credit = document.querySelector(".credit");
      const vision = document.querySelector(".vision");
      const visionText = document.querySelector(".vision-text");
      const visionBlink = document.querySelector(".vision-blink");
      const socialLinks = document.querySelectorAll(".social-links a");
      const copyright = document.querySelector(".copyright");

      if (a) a.style.color = link;
      if (welcome) welcome.style.color = link;
      if (instruction) instruction.style.color = link;
      if (credit) credit.style.color = link;
      if (vision) vision.style.color = link;
      if (visionText) visionText.style.color = link;
      if (visionBlink) visionBlink.style.color = link;
      if (copyright) copyright.style.color = link;
      socialLinks.forEach((icon) => (icon.style.color = link));
    }

    document.addEventListener("DOMContentLoaded", () => {
      const initial = getReadableColors();
      applyColors(initial.bg, initial.text, initial.link);

      document.body.addEventListener("click", (e) => {
        if (e.target.closest("a")?.getAttribute("href") === "gallery.html")
          return;

        const { bg, text, link } = getReadableColors();
        applyColors(bg, text, link);
      });
    });
  </script>
</head>

<body>
