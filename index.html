<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seonuk Kim</title>

  <!-- 💬 미리보기 카드용 메타태그 -->
  <meta property="og:title" content="Seonuk Kim">
  <meta property="og:description" content="hello@seonuk.kim — Contact me here.">
  <meta property="og:image" content="https://snkii.github.io/preview.png">
  <meta property="og:url" content="https://snkii.github.io">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 🔤 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=swap" rel="stylesheet">

  <!-- 🎨 스타일 -->
  <style>
    :root {
      --bg: #282828;
      --fg: #ebdbb2;
      --accent: #fabd2f;
      --hover: #fe8019;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      height: 100%;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    .center {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
    }

    a {
      text-decoration: none;
      font-size: 2.5rem;
      user-select: none;
      -webkit-user-select: none;
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .welcome {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: inherit;
      pointer-events: none;
      font-family: 'DM Sans', sans-serif;
    }

    .instruction {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: inherit;
      pointer-events: none;
      font-family: 'DM Sans', sans-serif;
      animation: blink 2s infinite alternate;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    @media (max-width: 600px) {
      a {
        font-size: 1.8rem;
      }
    }
  </style>

  <!-- 🎯 색상 랜덤 변경 스크립트 -->
  <script>
    const gruvboxColors = [
      "#282828", "#3c3836", "#504945", "#665c54", "#7c6f64",
      "#b8bb26", "#fabd2f", "#fe8019", "#fb4934", "#d3869b",
      "#8ec07c", "#ebdbb2", "#d5c4a1", "#928374",
      "#83a598", "#458588"
    ];

    function luminance(hex) {
      const rgb = hex.replace("#", "").match(/.{2}/g).map(c => parseInt(c, 16) / 255);
      const linear = rgb.map(c => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
      return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
    }

    function contrastRatio(c1, c2) {
      const L1 = luminance(c1);
      const L2 = luminance(c2);
      return (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05);
    }

    function getReadableColors() {
      let bg, text, link;
      const MAX_TRIES = 100;
      for (let i = 0; i < MAX_TRIES; i++) {
        bg = gruvboxColors[Math.floor(Math.random() * gruvboxColors.length)];
        text = gruvboxColors[Math.floor(Math.random() * gruvboxColors.length)];
        link = gruvboxColors[Math.floor(Math.random() * gruvboxColors.length)];

        const contrastText = contrastRatio(bg, text);
        const contrastLink = contrastRatio(bg, link);
        const distinct = new Set([bg, text, link]).size === 3;

        if (distinct && contrastText >= 4.5 && contrastLink >= 4.5) {
          return { bg, text, link };
        }
      }
      return { bg: "#282828", text: "#ebdbb2", link: "#fabd2f" };
    }

    function applyColors(bg, text, link) {
      document.body.style.backgroundColor = bg;
      document.body.style.color = text;

      const a = document.querySelector("a");
      const welcome = document.querySelector(".welcome");
      const instruction = document.querySelector(".instruction");

      if (a) a.style.color = link;
      if (welcome) welcome.style.color = link;
      if (instruction) instruction.style.color = link;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const initial = getReadableColors();
      applyColors(initial.bg, initial.text, initial.link);

      document.body.addEventListener("click", () => {
        const { bg, text, link } = getReadableColors();
        applyColors(bg, text, link);
      });
    });
  </script>
</head>
<body>
  <div class="welcome">This is seon.uk</div>

  <div class="center">
    <a href="mailto:hello@seonuk.kim"
       class="fade-in"
       onmousedown="return false"
       onselectstart="return false">
      hello@seonuk.kim
    </a>
  </div>

  <div class="instruction">Tap or click anywhere</div>
</body>
</html>
