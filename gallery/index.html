<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Photobook – Seonuk Kim</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="seon.uk" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- 보안 향상을 위한 메타태그 -->
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' https:;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
  script-src 'self' https://cdnjs.cloudflare.com;
">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), fullscreen=()">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate">

  <style>
    :root {
      --bg: #282828;
      --fg: #ebdbb2;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--fg);
      font-family: "DM Sans", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .top-banner {
      text-align: center;
      font-size: 3rem;
      color: var(--fg);
      margin-top: 20px;
      margin-bottom: 20px;
      user-select: none;
      animation: fadeIn 1.2s ease-in-out forwards;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: 0 20px 25px;
      max-width: 700px;
      margin: 0 auto;
    }

    .gallery img {
      max-width: 100%;
      width: auto;
      height: auto;
      border-radius: 6px;
      object-fit: cover;
      margin: 0 auto;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: fadeOnly 1s ease-in-out forwards;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOnly {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInDim {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 0.7;
        transform: translateY(0);
      }
    }

    .copyright {
      font-size: 0.4rem;
      color: var(--fg);
      opacity: 0.6;
      pointer-events: none;
      letter-spacing: 0.03em;
      text-align: center;
      padding-bottom: 25px;
    }

    .subtitle-alt {
      text-align: center;
      font-size: 0.9rem;
      margin-top: -10px;
      margin-bottom: 30px;
      opacity: 0;
      font-style: italic;
    }
  </style>
</head>

<body oncontextmenu="return false">
  <div class="top-banner">
    Photobook
  </div>
  <div class="subtitle-alt" style="animation: fadeInDim 1.2s ease-in-out forwards;">
    A visual journal taken with GR3x and iPhone
  </div>

  <div class="gallery">
    <img src="images/photo1.jpg" alt="Photo 1" style="animation-delay: 1.4s" />
    <img src="images/photo2.jpg" alt="Photo 2" style="animation-delay: 1.8s" />
    <img src="images/photo3.jpeg" alt="Photo 3" style="animation-delay: 2.2s" />

  </div>
  <div class="copyright">© 2025 Seonuk Kim. All rights reserved.</div>

</body>

</html>
